<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#153F32" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Janets Karenderya" />
  <meta name="description" content="Offline-first POS, Inventory & Financial Analytics for Janets Karenderya" />
  <title>Janets Karenderya</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- App Shell -->
  <div id="app">
    <!-- Offline indicator -->
    <div id="offline-banner" class="offline-banner hidden" role="status" aria-live="polite">
      <span class="offline-dot"></span>
      <span>You are offline. The app is working with local data.</span>
    </div>

    <!-- Update notification -->
    <div id="update-banner" class="update-banner hidden" role="status">
      <span>A new version is available.</span>
      <button id="update-app-btn" class="btn btn-small btn-emph">Update now</button>
      <button id="dismiss-update-btn" class="btn btn-small btn-ghost">Later</button>
    </div>

    <!-- Sidebar (desktop/tablet landscape) -->
    <aside id="sidebar" class="sidebar" aria-label="Main navigation">
      <div class="sidebar-brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="32" height="32">
            <defs>
              <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#35A879"/>
                <stop offset="100%" stop-color="#153F32"/>
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#lg1)"/>
            <path d="M10 20 L16 9 L22 20 Z" fill="#F7F7F1" opacity="0.95"/>
            <rect x="9" y="21" width="14" height="2.5" rx="1.2" fill="#DDF4E7"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">Janets</div>
          <div class="brand-sub">Karenderya</div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <button class="nav-item active" data-view="dashboard" aria-label="Dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-view="cashier" aria-label="Cashier">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>
          <span>Cashier</span>
        </button>
        <button class="nav-item" data-view="inventory" aria-label="Inventory">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7l9-4 9 4v10l-9 4-9-4V7z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>
          <span>Inventory</span>
        </button>
        <button class="nav-item" data-view="forecasts" aria-label="Profit & Forecasts">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
          <span>Profit & Forecasts</span>
        </button>
        <button class="nav-item" data-view="expenses" aria-label="Expenses">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 10h4.5a2 2 0 010 4H9h6"/></svg>
          <span>Expenses</span>
        </button>
        <button class="nav-item" data-view="transactions" aria-label="Transactions">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span>Transactions</span>
        </button>
        <button class="nav-item" data-view="reports" aria-label="Reports">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v18M16 3v18M3 8h18M3 16h18"/></svg>
          <span>Reports</span>
        </button>
        <button class="nav-item" data-view="settings" aria-label="Settings">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.5 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3h.1a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9v.1a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
          <span>Settings & Backup</span>
        </button>
      </nav>
      <div class="sidebar-footer">
        <div class="status-pill" id="db-status">
          <span class="status-dot online"></span>
          <span>Local data active</span>
        </div>
      </div>
    </aside>

    <!-- Main area -->
    <main class="main-area">
      <!-- Top bar -->
      <header class="topbar">
        <button id="menu-toggle" class="icon-btn mobile-only" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="topbar-title">
          <h1 id="page-title">Dashboard</h1>
          <p id="page-subtitle" class="muted">Today's overview</p>
        </div>
        <div class="topbar-actions">
          <span id="clock" class="clock" aria-live="polite"></span>
          <button id="quick-cashier" class="btn btn-emph btn-sm-icon" aria-label="Open cashier">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>
            <span class="hide-sm">Cashier</span>
          </button>
        </div>
      </header>

      <!-- View container -->
      <section id="view-container" class="view-container">
        <!-- Views are injected here -->
      </section>
    </main>

    <!-- Floating bottom nav (mobile) -->
    <nav id="bottom-nav" class="bottom-nav" aria-label="Quick navigation">
      <button class="bnav-item active" data-view="dashboard" aria-label="Dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
        <span>Home</span>
      </button>
      <button class="bnav-item" data-view="cashier" aria-label="Cashier">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>
        <span>Cashier</span>
      </button>
      <button class="bnav-fab" id="fab-add" aria-label="Add product">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="bnav-item" data-view="inventory" aria-label="Inventory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4v10l-9 4-9-4V7z"/></svg>
        <span>Inventory</span>
      </button>
      <button class="bnav-item" data-view="settings" aria-label="More">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
        <span>More</span>
      </button>
    </nav>

    <!-- Toast container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Modal container -->
    <div id="modal-root" class="modal-root hidden" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Scripts -->
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/cashier.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/forecasts.js"></script>
  <script src="js/expenses.js"></script>
  <script src="js/transactions.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
